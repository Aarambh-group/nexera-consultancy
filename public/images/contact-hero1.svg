<svg width="900" height="1000" viewBox="0 0 900 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="contactBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#122a5c"/>
      <stop offset="100%" stop-color="#0A1A3D"/>
    </linearGradient>
    <radialGradient id="worldGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#C9A25D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C9A25D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="1000" fill="url(#contactBg)"/>
  <rect width="900" height="1000" fill="url(#worldGlow)"/>

  <!-- subtle world map dot grid -->
  <g fill="#ffffff" opacity="0.12">
    <circle cx="120" cy="220" r="3"/><circle cx="160" cy="200" r="3"/><circle cx="200" cy="230" r="3"/>
    <circle cx="240" cy="190" r="3"/><circle cx="300" cy="210" r="3"/><circle cx="360" cy="180" r="3"/>
    <circle cx="420" cy="220" r="3"/><circle cx="480" cy="190" r="3"/><circle cx="540" cy="230" r="3"/>
    <circle cx="600" cy="200" r="3"/><circle cx="660" cy="220" r="3"/><circle cx="720" cy="190" r="3"/>
    <circle cx="780" cy="230" r="3"/><circle cx="140" cy="300" r="3"/><circle cx="220" cy="320" r="3"/>
    <circle cx="300" cy="290" r="3"/><circle cx="380" cy="310" r="3"/><circle cx="460" cy="280" r="3"/>
    <circle cx="540" cy="320" r="3"/><circle cx="620" cy="290" r="3"/><circle cx="700" cy="310" r="3"/>
    <circle cx="780" cy="280" r="3"/>
  </g>

  <!-- meeting table -->
  <ellipse cx="450" cy="760" rx="320" ry="60" fill="#060f24" opacity="0.6"/>

  <!-- three seated figures around table, backs to viewer -->
  <g transform="translate(280,560)">
    <circle cx="0" cy="0" r="34" fill="#C9A25D"/>
    <path d="M-52 90 Q-52 20 0 20 Q52 20 52 90 Z" fill="#1A1A2E"/>
  </g>
  <g transform="translate(450,600)">
    <circle cx="0" cy="0" r="30" fill="#e8c99a"/>
    <path d="M-46 80 Q-46 18 0 18 Q46 18 46 80 Z" fill="#0d2148"/>
  </g>
  <g transform="translate(620,560)">
    <circle cx="0" cy="0" r="34" fill="#C9A25D"/>
    <path d="M-52 90 Q-52 20 0 20 Q52 20 52 90 Z" fill="#1A1A2E"/>
  </g>

  <!-- documents on table -->
  <rect x="400" y="700" width="100" height="70" rx="4" fill="#F8F6F1" opacity="0.9"/>
  <rect x="415" y="712" width="70" height="6" rx="2" fill="#C9A25D" opacity="0.8"/>
  <rect x="415" y="726" width="50" height="5" rx="2" fill="#0A1A3D" opacity="0.4"/>
  <rect x="415" y="738" width="60" height="5" rx="2" fill="#0A1A3D" opacity="0.4"/>

  <!-- plane silhouette top right -->
  <g transform="translate(680,110) rotate(-20)" fill="#ffffff" opacity="0.85">
    <path d="M0 0 L70 10 L140 0 L152 12 L82 24 L70 64 L56 64 L60 26 L0 14 Z"/>
  </g>

  <!-- decorative arcs -->
  <circle cx="450" cy="450" r="230" fill="none" stroke="#C9A25D" stroke-opacity="0.15" stroke-width="1.5"/>
  <circle cx="450" cy="450" r="280" fill="none" stroke="#C9A25D" stroke-opacity="0.1" stroke-width="1.5"/>
</svg>
